name: jojo-ai Review

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate kit (registry + context + skills)
        working-directory: kit
        run: npm run sync
